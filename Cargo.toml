[package]
name = "explorer"
version = "0.3.1"
edition = "2024"
description = "A native Explorer-style file manager for macOS, built with Rust and GPUI"
license = "MIT"
build = "build.rs"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
